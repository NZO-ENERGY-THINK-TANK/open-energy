name: Deploy Backend to ECS

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and push the image without deploying (service bootstrap)
        type: boolean
        default: false

concurrency:
  group: open-energy-ecs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

# Repository variables: AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_URI,
# STAGING_ECS_SERVICE_ARN (dev), PRODUCTION_ECS_SERVICE_ARN (main).
env:
  AWS_REGION: il-central-1
  AWS_PAGER: ''
  IMAGE_REPOSITORY: ${{ vars.ECR_REPOSITORY_URI }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate configuration and select ECS service
        env:
          STAGING_ECS_SERVICE_ARN: ${{ vars.STAGING_ECS_SERVICE_ARN }}
          PRODUCTION_ECS_SERVICE_ARN: ${{ vars.PRODUCTION_ECS_SERVICE_ARN }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/dev|refs/heads/main) ;;
            *) echo '::error::Only dev and main branches may build or deploy.'; exit 1 ;;
          esac
          if [[ ! "$IMAGE_REPOSITORY" =~ ^([0-9]{12})\.dkr\.ecr\.il-central-1\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo '::error::Set ECR_REPOSITORY_URI to an ECR repository URI in il-central-1 (without an image tag).'
            exit 1
          fi
          account_id="${BASH_REMATCH[1]}"
          if [[ ! "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::${account_id}:role/.+$ ]]; then
            echo '::error::Set AWS_DEPLOY_ROLE_ARN to a deployment role in the ECR account.'
            exit 1
          fi
          if [[ "$BUILD_ONLY" == 'true' ]]; then
            echo 'Manual build-only run: ECS deployment is disabled.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$GITHUB_REF" in
            refs/heads/dev)
              service_arn="${STAGING_ECS_SERVICE_ARN:?Set repository variable STAGING_ECS_SERVICE_ARN}"
              ;;
            refs/heads/main)
              service_arn="${PRODUCTION_ECS_SERVICE_ARN:?Set repository variable PRODUCTION_ECS_SERVICE_ARN}"
              ;;
          esac
          if [[ -n "$STAGING_ECS_SERVICE_ARN" && "$STAGING_ECS_SERVICE_ARN" == "$PRODUCTION_ECS_SERVICE_ARN" ]]; then
            echo '::error::Production must not use the staging service.'
            exit 1
          fi
          if [[ ! "$service_arn" =~ ^arn:aws:ecs:il-central-1:${account_id}:service/[^/]+/[^/]+$ ]]; then
            echo '::error::Selected ECS service ARN must belong to the ECR account in il-central-1.'
            exit 1
          fi
          echo "ECS_SERVICE_ARN=$service_arn" >> "$GITHUB_ENV"

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.39.3.zip \
            --output "$RUNNER_TEMP/awscliv2.zip"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP/aws-cli-install"
          sudo "$RUNNER_TEMP/aws-cli-install/aws/install" --update
          aws --version

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record pushed image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Build did not return a valid image digest.'
            exit 1
          fi
          echo "Image: $IMAGE_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Start ECS deployment by image digest
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Build did not return a valid image digest.'
            exit 1
          fi
          service_file="$RUNNER_TEMP/ecs-service.json"
          update_file="$RUNNER_TEMP/ecs-update.json"
          trap 'rm -f "$service_file" "$update_file"' EXIT
          umask 077
          aws ecs describe-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" --output json > "$service_file"
          # Refuse ambiguous configurations during an in-progress rollout.
          jq -e --arg arn "$ECS_SERVICE_ARN" \
            --arg image "$IMAGE_REPOSITORY@$IMAGE_DIGEST" '
            .service
            | if .serviceArn != $arn or .status.statusCode != "ACTIVE" then
                error("Selected Express service is not active")
              elif (.activeConfigurations | length) != 1 then
                error("Expected exactly one active service configuration")
              else
                .activeConfigurations[0].primaryContainer
                | if type != "object" or (.image | type) != "string" then
                    error("Missing primary container configuration")
                  else
                    {serviceArn: $arn, primaryContainer: (. + {image: $image})}
                  end
              end
          ' "$service_file" > "$update_file"
          # Preserve environment, secrets, port and logs; change only the image.
          # shortcut: rollout health is not checked here; add monitoring before relying on unattended releases.
          aws ecs update-express-gateway-service \
            --cli-input-json "file://$update_file" \
            --query 'service.{ServiceArn:serviceArn,TargetRevision:targetConfiguration.serviceRevisionArn}' \
            --output json
          echo 'ECS accepted the deployment request. Rollout completion has not been verified.' >> "$GITHUB_STEP_SUMMARY"
